<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ROOM404</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/room404.css">

</head>

<body>

    <div id="roomContainer">

        <img src="images/parchment-map.png"
             id="roomImage">

        <div class="hotspot" id="deskBtn"></div>
        <div class="hotspot" id="bookBtn"></div>
        <div class="hotspot" id="globeBtn"></div>
        <div class="hotspot" id="gramophoneBtn"></div>
        <div class="hotspot" id="projectBtn"></div>
        <div class="hotspot" id="treasureBtn"></div>
        <div class="hotspot" id="doorBtn"></div>

    </div>

    <div id="tooltip"></div>

    <div class="modal fade"
         id="roomModal"
         tabindex="-1">

        <div class="modal-dialog modal-xl modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title"
                        id="modalTitle"></h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body"
                     id="modalBody">
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script src="js/room404.js"></script>

</body>

</html>
