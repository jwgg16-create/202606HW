<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROOM404</title>

    <link rel="stylesheet" href="css/room404.css">
</head>

<body>

    <div id="room">

        <img src="images/parchment-map.png"
             id="roomBackground"
             alt="ROOM404">

        <!-- 透明熱區 -->

        <div class="hotspot" id="deskBtn"></div>

        <div class="hotspot" id="bookBtn"></div>

        <div class="hotspot" id="globeBtn"></div>

        <div class="hotspot" id="gramophoneBtn"></div>

        <div class="hotspot" id="projectBtn"></div>

        <div class="hotspot" id="treasureBtn"></div>

        <div class="hotspot" id="doorBtn"></div>

    </div>

    <!-- Tooltip -->

    <div id="tooltip"></div>

    <!-- Modal -->

    <div id="modal">

        <div id="modalContent">

            <button id="closeBtn">
                ×
            </button>

            <h2 id="modalTitle"></h2>

            <div id="modalBody"></div>

        </div>

    </div>

    <script src="js/room404.js"></script>

</body>
</html>
