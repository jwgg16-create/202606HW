<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROOM404</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div id="scene">

        <img src="images/moon-sky.png"
             class="layer moon"
             data-speed="0.05">

        <img src="images/tree-canopy.png"
             class="layer canopy"
             data-speed="0.30">

        <img src="images/forest-dark.png"
             class="layer forest"
             data-speed="0.80">

        <img src="images/fog-dark.png"
             class="layer fog"
             data-speed="1.50">

    </div>

    <div id="message">

        <h1>404</h1>

        <p>

            這裡什麼也沒有...

            <br>

            除非你誠心宣誓。

        </p>

    </div>

    <div id="spellArea">

        <button id="spellBtn">

            我在此誠心宣誓，
            我沒幹好事。

        </button>

    </div>

    <div id="inkTransition">

        <img src="images/ink-splash.png"
             alt="Ink">

    </div>

    <script src="js/main.js"></script>

</body>

</html>
